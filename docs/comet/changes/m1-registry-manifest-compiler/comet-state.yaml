acceptance:
  - id: A1
    source: brief.md
    text: A1：Go Module、`cmd/skillgate` 和 M1 规定的内部包可构建，`go test ./...` 通过。
    result: passed
    reason:
      text: go.mod 正确声明 module github.com/Lin-xun1113/SkillGate；cmd/skillgate 与 6 个
        internal 包均存在且可构建；Runtime 执行 go test ./... 全部 6 包 ok（exit 0, 340ms）。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：同一 Skill Package 在字段顺序、文本换行和机器上得到相同 Canonical
      Identity；非法绝对路径、`..`、Symbolic Link、重复路径和缺少 `SKILL.md` 被拒绝。
    result: passed
    reason:
      text: "internal/identity: CanonicalJSON 递归 normalize（CRLF/CR→LF）+ Go json
        确定键序；SkillPackageCanonical 依相对路径排序、UTF-8 校验、二进制
        Base64、拒绝绝对路径/../symlink/重复路径/缺少 SKILL.md；测试覆盖
        key-order、newline、unicode、different 与辅助 symlink 拒绝。"
      truncated: false
  - id: A3
    source: brief.md
    text: A3：Skill Registry 以内容 Hash 定位不可变 Version；重复注册相同内容幂等，注册不同内容不覆盖旧
      Version，读取结果可复现。
    result: passed
    reason:
      text: "internal/registry FileStore: 内容寻址 CAS（hash 目录 +
        canonical.json），TestFileCASRegisterSkillIsIdempotentAndImmutable、TestFi\
        leCASDifferentContentCreatesVersion、TestIdempotentRegistrationRebuildsM\
        issingIndex、TestSkillRegistrationDetectsTamperedCanonicalBlob
        覆盖幂等/不覆盖/可复现/索引重建/篡改检测。"
      truncated: false
  - id: A4
    source: brief.md
    text: A4：Suite Registry 校验稳定 Case ID、`evaluationMode`/`population`
      合法组合、Fixture/Schema/Expected 引用、Answer Key 隔离和内容 Hash，并保存不可变 Suite
      Version。
    result: passed
    reason:
      text: "internal/validation/suite.go: DUPLICATE_CASE_ID（Case ID
        空/重复）、validModePopulation
        校验（forced_injection/task_performance/security_probe 与 population
        组合）、Fixture 引用 validateReference +
        CONTENT_HASH_MISMATCH、isAnswerKeyReference 检测
        prompt/context/agentVisible 泄漏（LEAKAGE_DETECTED）；suite_test.go
        TestFileCASRegisterSuiteIsIdempotent。"
      truncated: false
  - id: A5
    source: brief.md
    text: A5：Compiler 能编译 M0 示例 Manifest，生成正确的 Baseline/Candidate Pair 数量、Trial
      数量、Pair ID、Trial ID 和 Identity Tuple；非 Treatment 字段完全一致。
    result: passed
    reason:
      text: internal/manifest TestCompileM0ManifestProducesDeterministicPlan 断言 24
        Pair/48 Trial、arm 顺序
        without_skill→with_skill、treatment=skill_version、Identity 完整；golden IDs
        sha256:c4084d73.../sha256:13fd1d64... 与独立 CLI 实测输出完全一致；两次编译 ID 稳定。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：Compiler 对缺少 Baseline/Candidate、重复 Case/Arm、Pair
      Environment/Fixture/Model/Grader 不一致、非法 Mode、越界路径、Secret 字段、Expected 泄漏和
      Hash 不一致返回稳定错误 Code，并且不生成部分计划。
    result: passed
    reason:
      text: Compile 中 len(diagnostics)>0 → return nil（不生成部分计划）；错误码覆盖
        PAIR_IDENTITY_MISMATCH/PATH_OUTSIDE_ROOT/SECRET_FIELD_PRESENT/DUPLICATE_CASE_ID/INVALID_EVALUATION_MODE/CONTENT_HASH_MISMATCH/UNSUPPORTED_TREATMENT
        等；field_mutation_test/mutation_test/negative_matrix_test 提供负向覆盖；独立实测非法
        manifest 返回 exit 3（FILE_NOT_FOUND）。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：CLI 默认人类输出，`--json` 输出版本化、稳定字段的诊断/编译结果；成功、用法错误、语义校验失败、Identity 冲突和 I/O
      错误使用不同退出码。
    result: passed
    reason:
      text: cmd/skillgate/main_test.go TestExitCodeContract 逐码映射与 spec 第 6
        章表格一致（INVALID_ARGUMENT=2...IO_ERROR=8）；TestJSONOutputHasVersionedDocument
        验证 version=skillgate.cli.v1；实测 --json 输出单 JSON 文档含
        version/ok/diagnostics，人类输出为摘要；integration_test 覆盖 subprocess 退出码。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：Registry 和 Compiler 不依赖外部 Credential、网络、PostgreSQL 或 Python；所有 M1
      Contract Test 使用仓库内 Synthetic Fixture。
    result: passed
    reason:
      text: go.mod 仅依赖 gopkg.in/yaml.v3；internal/cmd 全量扫描无
        postgres/net.http/grpc/python/docker/credential 引用（唯一匹配为 secret
        检测正则，属安全功能）；所有测试使用 t.TempDir() 与仓库内 fixture，无网络/数据库依赖。
      truncated: false
  - id: A9
    source: brief.md
    text: A9：M1 正式文档明确 Canonical Identity、Registry 生命周期、双臂限制、错误 Contract、幂等注册行为和后续
      M2 边界；PROJECT_STATUS 记录 M1 结果和 M2 入口。
    result: passed
    reason:
      text: ADR-008 明确 Canonical Identity/幂等注册/双臂限制/M2+
        边界；docs/contracts/experiment-manifest.md 覆盖 Hash
        投影；PROJECT_STATUS.md（2026-08-25 更新）记录 M1 结果、验收收敛过程和 M2 入口（PostgreSQL
        Queue/Lease、至少一次执行、Retry、幂等 Result Commit）；README.md 同步 M1 状态。
      truncated: false
