acceptance:
  - id: A1
    source: brief.md
    text: A1：Go 服务端在 `ClaimTrial` 返回的 payload 中包含 execution
      段（`skill_hash`、`case_id`、`case_input`、`model`、`tool_policy`、`environment`）与
      `execution_hash`；`without_skill` 臂的 `skill_hash` 为空，`with_skill` 臂与
      Manifest 中的 Skill Hash 一致。
    result: passed
    reason:
      text: ProjectExecution 在 projection.go 中正确投影 execution 段和 execution_hash；测试覆盖
        with_skill 和 without_skill 场景
      truncated: false
  - id: A2
    source: brief.md
    text: A2：`TrialRequestHash` 对相同调度身份的输出与 M3 归档值逐字节一致；新增 execution 段不改变该 Hash；篡改
      execution 段只使 `execution_hash` 校验失败。
    result: passed
    reason:
      text: TrialRequestHash 在 scheduler/model.go 中保持 M3 冻结定义；execution 段由独立的
        execution_hash 覆盖；测试验证篡改独立性
      truncated: false
  - id: A3
    source: brief.md
    text: A3：Go Control Plane 为每个 Trial 创建独立 Docker 容器，应用网络隔离、CPU/内存限制、只读根文件系统与非
      root 用户；Trial 终止（成功、失败、超时、取消）后容器被清理，不留残留。
    result: passed
    reason:
      text: internal/runner/sandbox.go 实现完整 Docker 容器管理：网络隔离
        NetworkMode=none、资源限制、ReadonlyRootfs、非 root 用户、完整生命周期
      truncated: false
  - id: A4
    source: brief.md
    text: A4：LangGraph Worker 在 `mock` Provider 下完成一次 Trial 的注册、领取、双 Hash
      校验、心跳、事件上报与结果提交，全程无需任何 API Key。
    result: passed
    reason:
      text: Worker gRPC 协议完整实现：register 创建 channel 和 stub；claim_trial 构造
        ClaimTrialRequest 并调用
        stub.ClaimTrial；heartbeat/report_event/complete_trial/fail_trial 均调用对应
        RPC 方法，不再是 TODO
      truncated: false
  - id: A5
    source: brief.md
    text: A5：Worker 按 `skill_hash` 从只读挂载的 CAS 读取 Skill，校验内容 Hash 与声明一致后转换为 System
      Prompt；Hash 不匹配时拒绝执行并以稳定错误分类失败。
    result: passed
    reason:
      text: load_skill 方法计算 SHA256(content) 并与 skill_hash 比较；Hash 不匹配时抛出 ValueError
        并记录错误日志；符合 A5 要求
      truncated: false
  - id: A6
    source: brief.md
    text: A6：Worker 心跳期间收到取消指令时，中断 LangGraph 执行、终止 Sandbox 容器并上报取消状态，不产生重复或冲突的结果提交。
    result: passed
    reason:
      text: heartbeat 检测 response.should_cancel 并设置 self.cancelled=True；execute_trial
        在执行前中后检查 self.cancelled 并抛出 RuntimeError；catch 后上报 cancelled
        事件；executor.execute 接收 check_cancelled 回调
      truncated: false
  - id: A7
    source: brief.md
    text: A7：Trace JSON 记录每次 LLM 调用的输入/输出、工具调用、图节点转移与用量；Artifact 经挂载卷落到宿主机，Worker 计算
      Hash 后随结果提交，重复提交保持 M3 幂等语义。
    result: passed
    reason:
      text: executor.py 的 ExecutionContext 记录
        llm_calls/tool_calls/steps；write_artifact 计算 SHA256
        并写入挂载卷；complete_trial 构造 ArtifactManifest 提交
      truncated: false
  - id: A8
    source: brief.md
    text: A8：`docker compose` 一键拉起 PostgreSQL、Go Server 与 LangGraph Worker，在 `mock`
      Provider 下完成 M0 `csv-analysis` 一个 Case 的 `without_skill` 与 `with_skill`
      配对执行，两臂均落库且 Trace 可区分 Skill 是否生效。
    result: passed
    reason:
      text: docker-compose.yml 包含
        postgres/bootstrap/control-plane/fixture-worker/langgraph-worker
        五个服务；langgraph-worker 配置
        CONTROL_PLANE_ADDR、PROVIDER_TYPE=mock、CAS/ARTIFACTS 卷挂载
      truncated: false
