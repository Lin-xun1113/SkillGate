  - id: A4
    source: brief.md
    text: "Case Score = mean([1.0, 0.5, 1.0]) = 0.833 ## A3: Baseline/Candidate
      Pairing 给定 Experiment 包含 10 个 Case，每个 Case 有 without_skill 和 with_skill
      两臂："
    result: passed
    reason:
      text: Case score aggregation calculates mean of trial scores at
        aggregator.go:77, e.g. mean([1.0, 0.5, 1.0]) = 0.833
      truncated: false
  - id: A5
    source: brief.md
    text: Pairing 成功匹配 10 对
    result: passed
    reason:
      text: PairCases matches baseline/candidate by case_id at aggregator.go:95-147,
        creates valid pairs when case_id matches
      truncated: false
  - id: A6
    source: brief.md
    text: 计算 Paired Difference：`d_i = candidate_score_i - baseline_score_i`
    result: passed
    reason:
      text: Paired difference calculated as candidateScore - baselineScore at
        aggregator.go:133
      truncated: false
  - id: A7
    source: brief.md
    text: "无效 Pair（Case ID 不匹配、Repetition 不一致）被标记并排除 ## A4: Bootstrap CI 计算 给定 10 个
      Case 的 Paired Difference："
    result: passed
    reason:
      text: Invalid pairs marked with Valid=false and InvalidReason (case_id_mismatch,
        repetition_mismatch) at aggregator.go:114-130
      truncated: false
  - id: A8
    source: brief.md
    text: 执行 2000 次 Cluster Bootstrap（以 Case 为单位重采样）
    result: passed
    reason:
      text: ClusterBootstrapCI performs 2000 resamples (default config at
        bootstrap.go:33) with case-level resampling at bootstrap.go:43-92
      truncated: false
  - id: A9
    source: brief.md
    text: 报告点估计、2.5% 和 97.5% 分位数
    result: passed
    reason:
      text: Bootstrap reports percentile CI with 2.5% (lowerIdx) and 97.5% (upperIdx)
        at bootstrap.go:76-84
      truncated: false
  - id: A10
    source: brief.md
    text: '输出：`{"mean_lift": 0.15, "ci_lower": 0.05, "ci_upper": 0.25, "n_cases":
      10}` ## A5: pass@k 计算 给定一个 Case 有 5 次 Attempt，其中 3 次成功：'
    result: passed
    reason:
      text: BootstrapResult struct contains mean_estimate, ci_lower, ci_upper, n_cases
        per bootstrap.go:23-29, returned at bootstrap.go:86-92
      truncated: false
  - id: A11
    source: brief.md
    text: pass@1 = 3/5 = 0.6
    result: passed
    reason:
      text: "pass@1 calculated correctly: PassAtK with k=1 uses formula 1 -
        C(n-c,k)/C(n,k) at statistics/bootstrap.go:179-210, test confirms
        3/5=0.6"
      truncated: false
  - id: A12
    source: brief.md
    text: pass@3 = 1 - C(2,3)/C(5,3) = 1 - 0 = 1.0（至少 3 次中有 1 次成功）
    result: passed
    reason:
      text: pass@3 calculated via HumanEval formula at bootstrap.go:192-198, test
        confirms correct probability for at least 1 success in 3 attempts
      truncated: false
  - id: A13
    source: brief.md
    text: "pass^3 = (3/5)^3 = 0.216（严格 3 次都成功的概率） ## A6: JSON Report 生成 Experiment
      完成后："
    result: passed
    reason:
      text: pass^k computed as p^k where p=c/n at bootstrap.go:201-202, test confirms
        (3/5)^3 = 0.216
      truncated: false
  - id: A14
    source: brief.md
    text: 生成 `report.json` 包含： - Experiment Metadata - Case-level
