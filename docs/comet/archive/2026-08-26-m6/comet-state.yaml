acceptance:
  - id: A1
    source: brief.md
    text: A1：Policy 编译。合法 `ReleasePolicy` 通过 Parse/Type-check/Compile；相同 Priority
      被拒绝；未知字段、超长 Expression、Network/File Function 被拒绝；编译结果按 Policy Hash 可复用。
    result: passed
    reason:
      text: Policy parsing validates apiVersion/kind/metadata, rejects duplicate
        priority, banned functions, overlong expressions. Policy hash cached by
        Compile.
      truncated: false
  - id: A2
    source: brief.md
    text: A2：Trigger 聚合。Autonomous Trigger Case 按 polarity 计算 `routing.recall` 与
      `routing.specificity`；Security Probe 与 Answer Case 不进入 Trigger 分母。
    result: passed
    reason:
      text: AggregateTrigger computes recall/specificity from autonomous_trigger cases
        with polarity. Security/answer cases excluded from denominator.
      truncated: false
  - id: A3
    source: brief.md
    text: A3：Security 聚合。Security Probe Case 的 finding 计入 `security.critical` /
      `security.high` / `security.confirmed_exploits`；Scanner Evidence 缺失时
      `evidence.complete=false`。
    result: passed
    reason:
      text: AggregateSecurity counts critical/high/confirmed exploits from
        security_probe cases. Missing scanner evidence sets evaluated=false.
      truncated: false
  - id: A4
    source: brief.md
    text: A4：硬门禁 REJECT。`security.critical > 0` 或 `security.confirmed_exploits > 0`
      时 Decision 为 `REJECT`，即使 Utility Lift 为正。
    result: passed
    reason:
      text: ApplyHardGate returns REJECT when security.critical>0 or
        confirmed_exploits>0, overriding CEL result.
      truncated: false
  - id: A5
    source: brief.md
    text: A5：证据不足 HOLD。`evidence.complete=false`、必需 Trial 未完成、或 Lift CI 跨越 0 时至少为
      `HOLD`，不能 `PROMOTE`。
    result: passed
    reason:
      text: Evidence.complete set false when incomplete trials, trigger, or security
        evidence missing. Hard gate returns HOLD for evidence.complete=false and
        CI crossing zero.
      truncated: false
  - id: A6
    source: brief.md
    text: A6：正向晋级 PROMOTE。`utility.ci_lower > 0` 且 routing / reliability / cost /
      security 门禁全部通过时 Decision 为 `PROMOTE`。
    result: passed
    reason:
      text: Conservative policy rule requires utility.ci_lower>0, routing.recall>=0.9,
        specificity>=0.85, pass_at_3>=0.8, token_delta_ratio<=0.3,
        security.critical==0. Returns PROMOTE when all pass.
      truncated: false
  - id: A7
    source: brief.md
    text: A7：可解释 Decision Trace。输出包含 Policy Hash、Metric Snapshot
      Hash、命中规则、已评估未命中规则、失败条件与实际值；不能只返回一个枚举值。
    result: passed
    reason:
      text: Decision includes policy_hash, snapshot_hash, matched_rules,
        evaluated_rules, failed_conditions with actual values,
        hard_gate_override, explanation.
      truncated: false
  - id: A8
    source: brief.md
    text: A8：端到端接入。`ProcessExperiment` 在保存 Report 后自动评估 Policy，Decision 写入数据库并出现在
      `report.json`/`report.md`；无 Policy 引用时 Experiment 仍完成且报告不含 Decision。
    result: passed
    reason:
      text: ProcessExperiment retrieves GetSnapshot to reuse immutable snapshot,
        evaluates policy, saves decision to DB, appends to report JSON/MD/HTML.
        No policy_hash completes without decision.
      truncated: false
  - id: A9
    source: brief.md
    text: A9：Decision 引用冻结 Snapshot。同一 Snapshot 重复评估结果一致；Decision 不回读可变 Report 字段。
    result: passed
    reason:
      text: Decision references snapshot.Hash from Canonical payload. GetSnapshot
        retrieves persisted snapshot first; BuildSnapshot only when missing.
        Idempotent evaluation confirmed.
      truncated: false
  - id: A10
    source: brief.md
    text: A10：开发期检查。`go test ./internal/strategy/... ./internal/releasegate/...
      ./internal/metrics/... ./internal/grading/...`、`go vet ./...` 与 `go test
      ./...` 通过。
    result: passed
    reason:
      text: "Runtime checks passed: go test ./..., go vet ./..., git diff --check.
        Tests cover compilation, hard gates, trigger/security aggregation,
        idempotence."
      truncated: false
