version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=skillgate
      - POSTGRES_PASSWORD=skillgate
      - POSTGRES_DB=skillgate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skillgate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillgate"]
      interval: 5s
      timeout: 5s
      retries: 5

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.control-plane
    command: ["/bin/sh", "-c", "sleep 5 && /app/skillgate bootstrap --db-url postgresql://skillgate:skillgate@postgres:5432/skillgate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skillgate

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.control-plane
    ports:
      - "50051:50051"
    environment:
      - DB_URL=postgresql://skillgate:skillgate@postgres:5432/skillgate
      - CAS_ROOT=/cas
      - ARTIFACTS_ROOT=/artifacts
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ./cas:/cas
      - ./artifacts:/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks:
      - skillgate

  fixture-worker:
    build:
      context: ./workers/python/fixture_worker
      dockerfile: Dockerfile
    environment:
      - CONTROL_PLANE_ADDR=control-plane:50051
      - WORKER_ID=fixture-worker-1
      - CAS_ROOT=/cas
      - ARTIFACTS_ROOT=/artifacts
    volumes:
      - ./cas:/cas:ro
      - ./artifacts:/artifacts
    depends_on:
      - control-plane
    networks:
      - skillgate

  langgraph-worker:
    build:
      context: ./workers/python/langgraph_worker
      dockerfile: Dockerfile
    environment:
      - CONTROL_PLANE_ADDR=control-plane:50051
      - WORKER_ID=langgraph-worker-1
      - CAS_ROOT=/cas
      - ARTIFACTS_ROOT=/artifacts
      - PROVIDER_TYPE=mock
    volumes:
      - ./cas:/cas:ro
      - ./artifacts:/artifacts
    depends_on:
      - control-plane
    networks:
      - skillgate

networks:
  skillgate:
    driver: bridge

volumes:
  postgres_data:
  cas:
  artifacts:
