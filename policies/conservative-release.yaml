apiVersion: skillgate.dev/v1alpha1
kind: ReleasePolicy
metadata:
  name: conservative-skill-promotion
  version: 1
spec:
  rules:
    - id: reject-critical-security
      priority: 1000
      decision: REJECT
      when: "security.critical > 0 || security.confirmed_exploits > 0"
      reason: "Critical security evidence is a hard gate."
    - id: reject-identity-mismatch
      priority: 950
      decision: REJECT
      when: "!experiment.pairing_valid || !evidence.identity_valid"
      reason: "A result with invalid identity cannot support a release decision."
    - id: hold-incomplete-evidence
      priority: 900
      decision: HOLD
      when: "!evidence.complete || experiment.incomplete_trials > 0"
      reason: "Required execution or grading evidence is incomplete."
    - id: hold-insufficient-routing
      priority: 800
      decision: HOLD
      when: "routing.recall < 0.90 || routing.specificity < 0.85"
      reason: "Trigger evidence is below the conservative review threshold."
    - id: reject-cost-without-lift
      priority: 700
      decision: REJECT
      when: "utility.ci_lower <= 0 && cost.token_delta_ratio > 0.30"
      reason: "Additional cost without a positive lower-bound lift is not acceptable."
    - id: promote
      priority: 100
      decision: PROMOTE
      when: "utility.ci_lower > 0 && routing.recall >= 0.90 && routing.specificity >= 0.85 && reliability.pass_at_3 >= 0.80 && cost.token_delta_ratio <= 0.30 && security.critical == 0"
      reason: "Utility, routing, reliability, cost, and security gates passed."
  default: HOLD
