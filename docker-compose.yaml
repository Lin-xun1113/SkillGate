version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: skillgate
      POSTGRES_USER: skillgate
      POSTGRES_PASSWORD: skillgate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillgate"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.16.2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: >
      -path=/migrations
      -database="postgres://skillgate:skillgate@postgres:5432/skillgate?sslmode=disable"
      up
    restart: on-failure

  scheduler:
    build:
      context: .
      dockerfile: cmd/scheduler/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgres://skillgate:skillgate@postgres:5432/skillgate?sslmode=disable"
      WORKER_POOL_SIZE: "2"
    ports:
      - "8080:8080"
    volumes:
      - ./data/cas:/cas:ro
      - ./data/workspaces:/workspaces

  worker:
    build:
      context: ./workers/python
      dockerfile: Dockerfile
    depends_on:
      - scheduler
    environment:
      SCHEDULER_URL: "http://scheduler:8080"
      WORKER_ID: "worker-1"
    volumes:
      - ./data/cas:/cas:ro
      - ./data/workspaces:/workspaces

  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    depends_on:
      - scheduler
      - worker
    environment:
      DATABASE_URL: "postgres://skillgate:skillgate@postgres:5432/skillgate?sslmode=disable"
      PROJECT_ROOT: "/demo"
    volumes:
      - ./testdata/m0/csv-analysis:/demo:ro
      - ./data/cas:/cas
    command: >
      sh -c "
      sleep 10 &&
      skillgate materialize /demo/experiment.yaml --project-root /demo &&
      skillgate run-trial --wait
      "

volumes:
  postgres_data:
